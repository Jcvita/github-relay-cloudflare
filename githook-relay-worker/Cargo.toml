[package]
name = "githook-relay-worker"
version = "0.1.0"
edition = "2021"
authors = ["Joseph Vita <jcvita2012@gmail.com>"]

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.8"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
