name = "githook-relay-worker"
main = "build/index.js"
compatibility_date = "2026-10-06"

[[durable_objects.bindings]]
name = "GITHUB_HOOK_RELAY"
class_name = "GithubHookRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GithubHookRelay"]

[build]
command = "cargo install -q \"worker-build@^0.8\" && worker-build --release --panic-unwind"